syntax = "proto3";

package flwr.proto;

message RunCollection {
  string collection_id = 1;
  optional string title = 2;
  string metadata_json = 3;
  string created_at = 4;
  string updated_at = 5;
  optional uint64 last_run_id = 6;
}

message RunCollectionItem {
  string collection_id = 1;
  uint64 item_index = 2;
  string item_json = 3;
  string created_at = 4;
  optional uint64 run_id = 5;
  optional uint64 task_id = 6;
  optional string item_ref = 7;
  optional string parent_item_ref = 8;
}

message RunCollectionItemPayload {
  string item_json = 1;
  optional string item_ref = 2;
  optional string parent_item_ref = 3;
}
