syntax = "proto3";

package flwr.proto;

message Node { uint64 node_id = 1; }

message NodeInfo {
  uint64 node_id = 1;
  string owner_aid = 2;
  string owner_name = 3;
  string status = 4;
  string registered_at = 5;
  optional string last_activated_at = 6;
  optional string last_deactivated_at = 7;
  optional string unregistered_at = 8;
  optional double online_until = 9;
  double heartbeat_interval = 10;
  bytes public_key = 11;
  optional string location = 12;
  optional string name = 13;
}
