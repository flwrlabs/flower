syntax = "proto3";

package flwr.proto;

message Conversation {
  string conversation_id = 1;
  uint64 run_id = 2;
  string title = 3;
  double created_at = 4;
  double updated_at = 5;
}

message ConversationItem {
  string conversation_id = 1;
  uint64 item_index = 2;
  string item_json = 3;
  double created_at = 4;
  uint64 run_id = 5;
  optional uint64 task_id = 6;
}

message ConversationItemPayload { string item_json = 1; }
