syntax = "proto3";

package flwr.proto;

message ConversationParticipant {
  oneof participant {
    string flwr_aid = 1;
    uint64 agent_id = 2;
  }
}

message Conversation {
  string id = 1;
  string title = 2;
  string created_at = 3;
  repeated ConversationParticipant participants = 4;
}

message CreateConversationRequest {
  repeated ConversationParticipant participants = 1;
}
message CreateConversationResponse { Conversation conversation = 1; }

message ListConversationsRequest {}
message ListConversationsResponse { repeated Conversation conversations = 1; }

message ConversationMessage {
  uint64 id = 1;
  string conversation_id = 2;
  ConversationParticipant author = 3;
  string created_at = 4;
  string content = 5;
}

message GetConversationMessagesRequest {
  // Required by Control. Runtime uses the authenticated task's conversation.
  string conversation_id = 1;
  // Exclusive upper ID bound. Absent selects the newest page unless after_id is set.
  optional uint64 before_id = 2;
  // Absent uses the server's default page size.
  optional uint32 limit = 3;
  // Runtime only: exclusive lower bound, selecting the earliest matching page.
  optional uint64 after_id = 4;
}
message GetConversationMessagesResponse {
  // Messages in the selected page, ordered by ascending ID.
  repeated ConversationMessage messages = 1;
}

message SendConversationMessageRequest {
  // Required by Control. Runtime uses the authenticated task's conversation.
  string conversation_id = 1;
  // The author is resolved from the authenticated account or task.
  string content = 2;
}
message SendConversationMessageResponse { ConversationMessage message = 1; }
