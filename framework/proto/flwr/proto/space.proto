syntax = "proto3";

package flwr.proto;

message SpaceParticipant {
  oneof participant {
    string flwr_aid = 1;
    uint64 agent_id = 2;
  }
}

message Space {
  string id = 1;
  string title = 2;
  string created_at = 3;
  repeated SpaceParticipant participants = 4;
}

message CreateSpaceRequest { repeated SpaceParticipant participants = 1; }
message CreateSpaceResponse { Space space = 1; }

message ListSpacesRequest {}
message ListSpacesResponse { repeated Space spaces = 1; }

message SpaceMessage {
  uint64 id = 1;
  string space_id = 2;
  SpaceParticipant author = 3;
  string created_at = 4;
  string content = 5;
}

message GetSpaceMessagesRequest {
  // Required by Control. Runtime uses the authenticated task's Space.
  string space_id = 1;
  // Exclusive upper ID bound. Absent selects the newest page unless after_id is
  // set.
  optional uint64 before_id = 2;
  // Absent uses the server's default page size.
  optional uint32 limit = 3;
  // Runtime only: exclusive lower bound, selecting the earliest matching page.
  optional uint64 after_id = 4;
  // Runtime only: read the next unseen page and advance the agent's cursor.
  // Cannot be combined with before_id or after_id. History reads leave it
  // false.
  bool consume = 5;
}
message GetSpaceMessagesResponse {
  // Messages in the selected page, ordered by ascending ID.
  repeated SpaceMessage messages = 1;
}

message SendSpaceMessageRequest {
  // Required by Control. Runtime uses the authenticated task's Space.
  string space_id = 1;
  // The author is resolved from the authenticated account or task.
  string content = 2;
}
message SendSpaceMessageResponse { SpaceMessage message = 1; }
