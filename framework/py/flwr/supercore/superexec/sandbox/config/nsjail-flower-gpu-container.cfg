# Flower SuperExec nsjail PoC profile for GPU-enabled containers.
#
# This config is intentionally compatibility-first. It is designed for a
# prepared outer container runtime that already exposes the selected GPU devices,
# NVIDIA userspace libraries, and AppIO network connectivity. The outer runtime
# seccomp profile must allow nsjail setup syscalls; this file is the inner app
# workload sandbox policy, not an OCI seccomp profile.

name: "flower-app"
mode: ONCE
cwd: "/tmp"
time_limit: 0

# Keep container network access so flwr-*app can reach AppIO.
clone_newnet: false
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
# Docker Desktop blocks sethostname in this nested sandbox configuration even
# when the outer container has CAP_SYS_ADMIN, so keep the outer UTS namespace.
clone_newuts: false
clone_newcgroup: false

keep_env: true
keep_caps: false

rlimit_cpu: 3600
rlimit_fsize: 2048
rlimit_nofile: 4096
rlimit_nproc: 1024
rlimit_memlock: 67108864

# Compatibility-first seccomp for the customer PoC. Tighten after validating the
# target framework/GPU workload and required NVIDIA syscalls.
seccomp_string: "DEFAULT ALLOW"

mount {
  src: "/"
  dst: "/"
  is_bind: true
  rw: false
}

mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  options: "size=1073741824"
  nosuid: true
  nodev: true
}

mount {
  dst: "/dev/shm"
  fstype: "tmpfs"
  rw: true
  options: "size=4294967296"
  nosuid: true
  nodev: true
}

# Keep the container root filesystem read-only, but give Flower a writable,
# sandbox-local home for installing FAB contents and runtime cache files.
mount {
  dst: "/root/.flwr"
  fstype: "tmpfs"
  rw: true
  options: "size=1073741824"
  nosuid: true
  nodev: true
}

# Common ML/data libraries write cache and generated config under the user home.
# Keep those writes ephemeral and confined to the app sandbox.
mount {
  dst: "/root/.cache"
  fstype: "tmpfs"
  rw: true
  options: "size=1073741824"
  nosuid: true
  nodev: true
}

mount {
  dst: "/root/.config"
  fstype: "tmpfs"
  rw: true
  options: "size=67108864"
  nosuid: true
  nodev: true
}

# Docker Desktop denies mounting a fresh procfs from inside the container. Bind
# the existing container /proc read-only so ML runtimes can inspect CPU/system
# information without allowing writes to procfs.
mount {
  src: "/proc"
  dst: "/proc"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}

# Optional GPU device nodes. The outer container runtime is responsible for
# selecting and exposing devices. Mark these optional so CPU-only smoke tests can
# still launch with this PoC profile.
mount {
  src: "/dev/nvidiactl"
  dst: "/dev/nvidiactl"
  is_bind: true
  rw: true
  mandatory: false
  is_dir: false
}

mount {
  src: "/dev/nvidia-uvm"
  dst: "/dev/nvidia-uvm"
  is_bind: true
  rw: true
  mandatory: false
  is_dir: false
}

mount {
  src: "/dev/nvidia-uvm-tools"
  dst: "/dev/nvidia-uvm-tools"
  is_bind: true
  rw: true
  mandatory: false
  is_dir: false
}

mount {
  src: "/dev/nvidia0"
  dst: "/dev/nvidia0"
  is_bind: true
  rw: true
  mandatory: false
  is_dir: false
}
