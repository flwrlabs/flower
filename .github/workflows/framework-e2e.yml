name: Framework E2E

on:
  push:
    branches:
      - main
      - "release/framework-*"
  pull_request:
    branches:
      - main
      - "release/framework-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLWR_TELEMETRY_ENABLED: 0
  ARTIFACT_BUCKET: artifact.flower.ai

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      framework: ${{ steps.filter.outputs.framework }}
    steps:
      - uses: actions/checkout@v5

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            framework:
              - 'framework/**/*'
              - 'src/**/*'
              - '.github/workflows/framework.yml'
              - '.github/workflows/framework-e2e.yml'

  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: Build, test and upload wheel
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Install dependencies
        run: |
          cd framework
          uv sync --locked --all-extras --all-groups
      - name: Build wheel
        run: |
          cd framework
          uv run --no-sync ./dev/build.sh
      - name: Test wheel
        run: |
          cd framework
          uv run --no-sync ./dev/test-wheel.sh
      - name: Collect artifact metadata
        id: artifacts
        run: |
          cd framework/dist
          echo "WHL_PATH=$(ls *.whl)" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          [ -z "${GITHUB_HEAD_REF}" ] && dir="${GITHUB_REF_NAME}" || dir="pr/${GITHUB_HEAD_REF}"
          echo "DIR=${dir}" >> "$GITHUB_OUTPUT"
      - name: Upload compatibility artifacts
        if: ${{ github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        env:
          AWS_DEFAULT_REGION: ${{ secrets.ARTIFACT_AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_AWS_SECRET_KEY_ID }}
          ARTIFACT_DIR: ${{ steps.artifacts.outputs.DIR }}
          SHORT_SHA: ${{ steps.artifacts.outputs.SHORT_SHA }}
        run: |
          cd framework/dist
          aws s3 cp --content-disposition "attachment" --cache-control "no-cache" ./ s3://${{ secrets.ARTIFACT_AWS_BUCKET_NAME }}/py/${ARTIFACT_DIR}/${SHORT_SHA} --recursive
          aws s3 cp --content-disposition "attachment" --cache-control "no-cache" ./ s3://${{ secrets.ARTIFACT_AWS_BUCKET_NAME }}/py/${ARTIFACT_DIR}/latest --recursive
      - name: Upload commit artifacts
        if: ${{ github.repository == 'flwrlabs/flower' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          AWS_DEFAULT_REGION: ${{ secrets.ARTIFACT_AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_AWS_SECRET_KEY_ID }}
        run: |
          aws s3 cp --content-disposition "attachment" --cache-control "no-cache" framework/dist/ s3://${{ secrets.ARTIFACT_AWS_BUCKET_NAME }}/framework/commits/${GITHUB_SHA}/ --recursive
    outputs:
      whl_path: ${{ steps.artifacts.outputs.WHL_PATH }}
      short_sha: ${{ steps.artifacts.outputs.SHORT_SHA }}
      dir: ${{ steps.artifacts.outputs.DIR }}

  prepare-docker-build-matrix:
    if: ${{ github.repository == 'flwrlabs/flower' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Collect Docker build parameters
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: wheel
    outputs:
      pip-version: ${{ steps.bootstrap.outputs.pip-version }}
      setuptools-version: ${{ steps.bootstrap.outputs.setuptools-version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap
        id: bootstrap
        uses: ./.github/actions/bootstrap

      - name: Validate Docker publishing configuration
        run: |
          if [ -z "${{ vars.DOCKER_IMAGE_REGISTRY }}" ]; then
            echo "Missing required configuration: DOCKER_IMAGE_REGISTRY" >&2
            exit 1
          fi
          if [ -z "${{ vars.DOCKER_IMAGE_REGISTRY_USER }}" ]; then
            echo "Missing required configuration: DOCKER_IMAGE_REGISTRY_USER" >&2
            exit 1
          fi
          if [ -z "${{ vars.DOCKER_IMAGE_NAMESPACE }}" ]; then
            echo "Missing required configuration: DOCKER_IMAGE_NAMESPACE" >&2
            exit 1
          fi

      - name: Generate Docker build matrix
        id: matrix
        env:
          WHEEL_PATH: ${{ needs.wheel.outputs.whl_path }}
        run: |
          WHEEL_URL="https://${ARTIFACT_BUCKET}/framework/commits/${GITHUB_SHA}/${WHEEL_PATH}"
          python framework/dev/build-docker-image-matrix.py \
            --flwr-version-ref "${WHEEL_URL}" \
            --image-tag unstable \
            > matrix.raw.json
          python framework/dev/release/resolve-docker-matrix.py \
            --input matrix.raw.json \
            --output matrix.json \
            --docker-image-namespace "${{ vars.DOCKER_IMAGE_NAMESPACE }}"
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build-docker-base-images:
    if: ${{ github.repository == 'flwrlabs/flower' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Build main base images
    uses: ./.github/workflows/_docker-build.yml
    needs: prepare-docker-build-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-docker-build-matrix.outputs.matrix).base }}
    with:
      registry: ${{ vars.DOCKER_IMAGE_REGISTRY }}
      image-repository: ${{ format('{0}/{1}', vars.DOCKER_IMAGE_REGISTRY, matrix.images.namespace_repository) }}
      file-dir: ${{ matrix.images.file_dir }}
      build-args: |
        PIP_VERSION=${{ needs.prepare-docker-build-matrix.outputs.pip-version }}
        SETUPTOOLS_VERSION=${{ needs.prepare-docker-build-matrix.outputs.setuptools-version }}
        ${{ matrix.images.build_args_encoded }}
      tags: ${{ matrix.images.tags_encoded }}
      docker-registry-user: ${{ vars.DOCKER_IMAGE_REGISTRY_USER }}
      export-index-digest: true
    secrets:
      docker-registry-token: ${{ secrets.DOCKER_IMAGE_REGISTRY_PASSWORD }}

  build-docker-binary-images:
    if: ${{ github.repository == 'flwrlabs/flower' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Build main binary images
    uses: ./.github/workflows/_docker-build.yml
    needs: [prepare-docker-build-matrix, build-docker-base-images]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-docker-build-matrix.outputs.matrix).binary }}
    with:
      registry: ${{ vars.DOCKER_IMAGE_REGISTRY }}
      image-repository: ${{ format('{0}/{1}', vars.DOCKER_IMAGE_REGISTRY, matrix.images.namespace_repository) }}
      file-dir: ${{ matrix.images.file_dir }}
      build-args: |
        BASE_REPOSITORY=${{ format('{0}/{1}/base', vars.DOCKER_IMAGE_REGISTRY, vars.DOCKER_IMAGE_NAMESPACE) }}
        BASE_IMAGE=${{ matrix.images.base_image }}
      tags: ${{ matrix.images.tags_encoded }}
      docker-registry-user: ${{ vars.DOCKER_IMAGE_REGISTRY_USER }}
      export-index-digest: true
    secrets:
      docker-registry-token: ${{ secrets.DOCKER_IMAGE_REGISTRY_PASSWORD }}

  store-docker-artifact-index:
    if: ${{ github.repository == 'flwrlabs/flower' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Store Docker artifact index
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      [
        prepare-docker-build-matrix,
        build-docker-base-images,
        build-docker-binary-images,
      ]
    steps:
      - name: Download OCI index digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: index-digest-*
          path: index-digests
          merge-multiple: true

      - name: Build artifact index
        env:
          COMMIT_SHA: ${{ github.sha }}
          MATRIX: ${{ needs.prepare-docker-build-matrix.outputs.matrix }}
        run: |
          expected="$(jq '(.base.images | length) + (.binary.images | length)' <<< "${MATRIX}")"
          digest_count="$(find index-digests -name '*.json' -type f | wc -l | tr -d ' ')"
          if [[ "${digest_count}" != "${expected}" ]]; then
            echo "::error::Expected ${expected} OCI index digests, found ${digest_count}."
            exit 1
          fi

          jq -s \
            --arg commit_sha "${COMMIT_SHA}" \
            '{schema_version: 1, commit_sha: $commit_sha, images: sort_by(.repository, .tags[0])}' \
            index-digests/*.json > digests.json
          jq --exit-status \
            --arg commit_sha "${COMMIT_SHA}" \
            --argjson expected "${expected}" \
            '.schema_version == 1
              and .commit_sha == $commit_sha
              and ($commit_sha | test("^[0-9a-f]{40}$"))
              and (.images | length) == $expected
              and all(.images[];
                (.repository | length) > 0
                and (.tags | length) > 0
                and (.index_digest | test("^sha256:[0-9a-f]{64}$")))' \
            digests.json > /dev/null

      - name: Upload artifact index
        env:
          AWS_DEFAULT_REGION: ${{ secrets.ARTIFACT_AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACT_AWS_SECRET_KEY_ID }}
        run: |
          aws s3 cp \
            --content-disposition "attachment" \
            --cache-control "no-cache" \
            digests.json \
            s3://${{ secrets.ARTIFACT_AWS_BUCKET_NAME }}/framework/commits/${GITHUB_SHA}/digests.json

  superexec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        directory: [e2e-bare-auth]
        connection: [secure, insecure]
        engine: [deployment-engine, simulation-engine]
        authentication: [no-auth, client-auth]
        exclude:
          - connection: insecure
            authentication: client-auth
    name: Control API / Python ${{ matrix.python-version }} / ${{ matrix.connection }} / ${{ matrix.authentication }} / ${{ matrix.engine }}
    defaults:
      run:
        working-directory: framework/e2e/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Flower from repo
        if: ${{ needs.changes.outputs.framework == 'true' && (github.repository != 'flwrlabs/flower' || github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}
        working-directory: ./framework
        run: |
          if [[ "${{ matrix.engine }}" == "simulation-engine" ]]; then
            python -m pip install ".[simulation]"
          else
            python -m pip install .
          fi
      - name: Download and install Flower wheel from artifact store
        if: ${{ needs.changes.outputs.framework == 'true' && github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        run: |
          # Define base URL for wheel file
          WHEEL_URL="https://${{ env.ARTIFACT_BUCKET }}/py/${{ needs.wheel.outputs.dir }}/${{ needs.wheel.outputs.short_sha }}/${{ needs.wheel.outputs.whl_path }}"
          if [[ "${{ matrix.engine }}" == "simulation-engine" ]]; then
            python -m pip install "flwr[simulation] @ ${WHEEL_URL}"
          else
            python -m pip install "${WHEEL_URL}"
          fi
      - name: >
          Run Control API test /
          ${{ matrix.connection }} /
          ${{ matrix.authentication }} /
          ${{ matrix.engine }}
        if: ${{ needs.changes.outputs.framework == 'true' }}
        working-directory: framework/e2e/${{ matrix.directory }}
        run: ./../test_control_api.sh "${{ matrix.connection }}" "${{ matrix.authentication}}" "${{ matrix.engine }}"

  frameworks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    # Using approach described here:
    # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
    strategy:
      matrix:
        include:
          - directory: e2e-bare
            e2e: e2e_bare

          - directory: e2e-bare-https
            e2e: e2e_bare_https

          - directory: e2e-bare-auth
            e2e: e2e_bare_auth

          - directory: e2e-jax
            e2e: e2e_jax

          - directory: e2e-pytorch
            e2e: e2e_pytorch
            dataset: |
              from datasets import load_dataset
              load_dataset('uoft-cs/cifar10')

          - directory: e2e-tensorflow
            e2e: e2e_tensorflow
            dataset: |
              from datasets import load_dataset
              load_dataset('uoft-cs/cifar10')

          - directory: e2e-opacus
            e2e: e2e_opacus
            dataset: |
              from datasets import load_dataset
              load_dataset('uoft-cs/cifar10')

          - directory: e2e-pytorch-lightning
            e2e: e2e_pytorch_lightning

          - directory: e2e-scikit-learn
            e2e: e2e_scikit_learn

          - directory: e2e-fastai
            e2e: e2e_fastai
            dataset: |
              from fastai.vision.all import untar_data, URLs
              untar_data(URLs.MNIST)

          - directory: e2e-pandas
            e2e: e2e_pandas
            dataset: |
              from pathlib import Path
              from sklearn.datasets import load_iris
              Path('data').mkdir(exist_ok=True)
              load_iris(as_frame=True)['data'].to_csv('./data/client.csv')

    name: Framework / ${{ matrix.directory }}

    defaults:
      run:
        working-directory: framework/e2e/${{ matrix.directory }}

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          python -m pip install -U pip==26.0.1
        shell: bash
      # Using approach described here for Python location caching:
      # https://blog.allenai.org/python-caching-in-github-actions-e9452698e98d
      - name: Cache Python location
        if: ${{ needs.changes.outputs.framework == 'true' }}
        id: cache-restore-python
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.pythonLocation }}
          key: pythonloc-${{ runner.os }}-${{ matrix.directory }}-${{ env.pythonLocation }}-${{ hashFiles(format('./framework/e2e/{0}/pyproject.toml', matrix.directory)) }}
      - name: Install dependencies
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: python -m pip install --upgrade . --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install Flower wheel from artifact store
        if: ${{ needs.changes.outputs.framework == 'true' && github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        run: |
          WHEEL_URL="https://${{ env.ARTIFACT_BUCKET }}/py/${{ needs.wheel.outputs.dir }}/${{ needs.wheel.outputs.short_sha }}/${{ needs.wheel.outputs.whl_path }}"
          python -m pip install "flwr[simulation] @ ${WHEEL_URL}"
      - name: Download dataset
        if: ${{ needs.changes.outputs.framework == 'true' && matrix.dataset }}
        run: python -c "${{ matrix.dataset }}"
      - name: Run edge client test
        if: ${{ needs.changes.outputs.framework == 'true' && matrix.directory != 'e2e-bare-auth' }}
        working-directory: framework/e2e/${{ matrix.directory }}/${{ matrix.e2e }}
        run: ./../../test_legacy.sh "${{ matrix.directory }}"
      - name: Run virtual client test
        if: ${{ needs.changes.outputs.framework == 'true' && matrix.directory != 'e2e-bare-auth' }}
        run: python simulation.py
      - name: Run simulation engine test
        if: ${{ needs.changes.outputs.framework == 'true' && (matrix.directory == 'e2e-pytorch' || matrix.directory == 'e2e-tensorflow') }}
        run: python simulation_next.py
      - name: Run driver test
        if: ${{ needs.changes.outputs.framework == 'true' && matrix.directory != 'e2e-bare-auth' }}
        run: ./../test_superlink.sh "${{ matrix.directory }}"
      - name: Run driver test with SQLite database
        if: ${{ needs.changes.outputs.framework == 'true' && matrix.directory == 'e2e-bare' }}
        run: ./../test_superlink.sh bare sqlite
      - name: Run driver test with client authentication
        if: ${{ needs.changes.outputs.framework == 'true' && matrix.directory == 'e2e-bare-auth' }}
        run: ./../test_superlink.sh "${{ matrix.directory }}" client-auth
      # - name: Run reconnection test with SQLite database (Temporarily disabled due to in-memory ObjectStore)
      #   if: ${{ needs.changes.outputs.framework == 'true' && matrix.directory == 'e2e-bare' }}
      #   run: ./../test_reconnection.sh sqlite
      - name: Cache save Python location
        id: cache-save-python
        uses: actions/cache/save@v4
        if: ${{ needs.changes.outputs.framework == 'true' && github.ref_name == 'main' &&  !steps.cache-restore-python.outputs.cache-hit }}
        with:
          path: ${{ env.pythonLocation }}
          key: pythonloc-${{ runner.os }}-${{ matrix.directory }}-${{ env.pythonLocation }}-${{ hashFiles(format('./framework/e2e/{0}/pyproject.toml', matrix.directory)) }}

  strategies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    strategy:
      matrix:
        strat:
          [
            "FedMedian",
            "FedTrimmedAvg",
            "QFedAvg",
            "FaultTolerantFedAvg",
            "FedAvgM",
            "FedAdam",
            "FedAdagrad",
            "FedYogi"
          ]

    name: Strategy / ${{ matrix.strat }}

    defaults:
      run:
        working-directory: framework/e2e/strategies

    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: ./.github/actions/bootstrap
      - name: Install dependencies
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          python -m pip install --upgrade .
      - name: Install Flower wheel from artifact store
        if: ${{ needs.changes.outputs.framework == 'true' && github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        run: |
          WHEEL_URL="https://${{ env.ARTIFACT_BUCKET }}/py/${{ needs.wheel.outputs.dir }}/${{ needs.wheel.outputs.short_sha }}/${{ needs.wheel.outputs.whl_path }}"
          python -m pip install "flwr[simulation] @ ${WHEEL_URL}"
      - name: Cache Datasets
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: actions/cache@v4
        with:
          path: "~/.keras"
          key: keras-datasets
      - name: Download Datasets
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          python -c "import tensorflow as tf; tf.keras.datasets.mnist.load_data()"
      - name: Test strategies
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          python test.py "${{ matrix.strat }}"

  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    strategy:
      matrix:
        include:
          - example: quickstart-pytorch
          - example: quickstart-tensorflow
          - example: quickstart-jax
          - example: quickstart-sklearn
          - example: quickstart-numpy

    name: App / ${{ matrix.example }}

    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: ./.github/actions/bootstrap
      - name: Install Flower from repo
        if: ${{ needs.changes.outputs.framework == 'true' && (github.repository != 'flwrlabs/flower' || github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}
        run: |
          cd framework
          python -m pip install .
      - name: Install Flower wheel from artifact store
        if: ${{ needs.changes.outputs.framework == 'true' && github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        run: |
          WHEEL_URL="https://${{ env.ARTIFACT_BUCKET }}/py/${{ needs.wheel.outputs.dir }}/${{ needs.wheel.outputs.short_sha }}/${{ needs.wheel.outputs.whl_path }}"
          python -m pip install "flwr[simulation] @ ${WHEEL_URL}"
      - name: Run project
        if: ${{ needs.changes.outputs.framework == 'true' }}
        working-directory: examples/${{ matrix.example }}
        run: |
          flwr run --run-config num-server-rounds=1 --stream 2>&1 | tee flwr_output.log 
          output=$(flwr ls --format=json)
          if ! echo "$output" | jq -e '.success == true and (.runs | length) == 1 and .runs[0].status == "finished:completed"' > /dev/null; then
            echo "Unexpected flwr ls output:"
            echo "$output"
            exit 1
          fi

  pull-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    env:
      ACCOUNT: "flwrlabs"
      APP_NAME: "numpy-ci"

    name: flwr new @

    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: ./.github/actions/bootstrap
      - name: Install Flower from repo
        if: ${{ needs.changes.outputs.framework == 'true' && (github.repository != 'flwrlabs/flower' || github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}
        run: |
          cd framework
          python -m pip install .
      - name: Install Flower wheel from artifact store
        if: ${{ needs.changes.outputs.framework == 'true' && github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        run: |
          WHEEL_URL="https://${{ env.ARTIFACT_BUCKET }}/py/${{ needs.wheel.outputs.dir }}/${{ needs.wheel.outputs.short_sha }}/${{ needs.wheel.outputs.whl_path }}"
          python -m pip install "flwr[simulation] @ ${WHEEL_URL}"
      - name: Create project and install it
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          flwr new @$ACCOUNT/$APP_NAME
          cd $APP_NAME
          pip install .
      - name: Run project
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          cd $APP_NAME
          flwr run . --run-config num-server-rounds=1 --stream 2>&1 | tee flwr_output.log 
          output=$(flwr ls --format=json)
          if ! echo "$output" | jq -e '.success == true and (.runs | length) == 1 and .runs[0].status == "finished:completed"' > /dev/null; then
            echo "Unexpected flwr ls output:"
            echo "$output"
            exit 1
          fi

  build_and_install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    strategy:
      matrix:
        framework: ["numpy"]
        python-version: ["3.11", "3.12", "3.13"]
    name: Build & Install / Python ${{ matrix.python-version }} / ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Flower from repo
        if: ${{ needs.changes.outputs.framework == 'true' && (github.repository != 'flwrlabs/flower' || github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}
        run: |
          cd framework
          python -m pip install .
      - name: Install Flower wheel from artifact store
        if: ${{ needs.changes.outputs.framework == 'true' && github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        run: |
          WHEEL_URL="https://${{ env.ARTIFACT_BUCKET }}/py/${{ needs.wheel.outputs.dir }}/${{ needs.wheel.outputs.short_sha }}/${{ needs.wheel.outputs.whl_path }}"
          python -m pip install "flwr[simulation] @ ${WHEEL_URL}"
      - name: Create project, build, and install it
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          flwr new @flwrlabs/numpy-ci
          cd numpy-ci
          flwr build
          flwr install *.fab

  numpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ["1.26"]
        python-version: ["3.11"]
        directory: [e2e-bare-auth]
        connection: [insecure]
        engine: [deployment-engine, simulation-engine]
        authentication: [no-auth]
    name: NumPy ${{ matrix.numpy-version }} / Python ${{ matrix.python-version }} / ${{ matrix.connection }} / ${{ matrix.authentication }} / ${{ matrix.engine }}
    defaults:
      run:
        working-directory: framework/e2e/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Flower from repo
        if: ${{ needs.changes.outputs.framework == 'true' && (github.repository != 'flwrlabs/flower' || github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}
        working-directory: ./framework
        run: |
          if [[ "${{ matrix.engine }}" == "simulation-engine" ]]; then
            python -m pip install ".[simulation]" "numpy>=${{ matrix.numpy-version }},<2.0"
          else
            python -m pip install . "numpy>=${{ matrix.numpy-version }},<2.0"
          fi
      - name: Download and install Flower wheel from artifact store
        if: ${{ needs.changes.outputs.framework == 'true' && github.repository == 'flwrlabs/flower' && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
        run: |
          # Define base URL for wheel file
          WHEEL_URL="https://${{ env.ARTIFACT_BUCKET }}/py/${{ needs.wheel.outputs.dir }}/${{ needs.wheel.outputs.short_sha }}/${{ needs.wheel.outputs.whl_path }}"
          if [[ "${{ matrix.engine }}" == "simulation-engine" ]]; then
            python -m pip install "flwr[simulation] @ ${WHEEL_URL}" "numpy>=${{ matrix.numpy-version }},<2.0"
          else
            python -m pip install "${WHEEL_URL}" "numpy>=${{ matrix.numpy-version }},<2.0"
          fi
      - name: >
          Run Flower - NumPy 1.26 test /
          ${{ matrix.connection }} /
          ${{ matrix.authentication }} /
          ${{ matrix.engine }}
        if: ${{ needs.changes.outputs.framework == 'true' }}
        working-directory: framework/e2e/${{ matrix.directory }}
        run: ./../test_control_api.sh "${{ matrix.connection }}" "${{ matrix.authentication}}" "${{ matrix.engine }}"

  windows-compatibility:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    timeout-minutes: 10
    needs: [changes, wheel]

    name: Windows compatibility test

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        if: ${{ needs.changes.outputs.framework == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: python -m pip install -U pip==26.0.1
      - name: Install dependencies
        if: ${{ needs.changes.outputs.framework == 'true' }}
        run: |
          cd framework
          python -m pip install --upgrade .
      - name: Run test
        if: ${{ needs.changes.outputs.framework == 'true' }}
        timeout-minutes: 5
        working-directory: ./framework/e2e
        run: ./test_windows.sh
        shell: bash

  serverapp-heartbeat-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes, wheel]
    strategy:
      matrix:
        engine: [deployment, simulation]
        python-version: ["3.11"]

    if: ${{ needs.changes.outputs.framework == 'true' }}
    name: ServerApp/run heartbeat test with ${{ matrix.engine }} runtime / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install -U pip==26.0.1
      - name: Install dependencies
        run: |
          cd framework
          python -m pip install --upgrade .[simulation]
      - name: Run test
        working-directory: ./framework/e2e/e2e-serverapp-heartbeat
        run: python ../test_serverapp_heartbeat.py ${{ matrix.engine }}
        shell: bash
