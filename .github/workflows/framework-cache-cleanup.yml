name: Framework Cache Cleanup

on:
  workflow_dispatch

jobs:
  e2e-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Using approach described here:
    # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs
    strategy:
      matrix:
        include:
          - directory: e2e-bare
          - directory: e2e-bare-https
          - directory: e2e-bare-auth
          - directory: e2e-jax
          - directory: e2e-pytorch
          - directory: e2e-tensorflow
          - directory: e2e-opacus
          - directory: e2e-pytorch-lightning
          - directory: e2e-scikit-learn
          - directory: e2e-fastai
          - directory: e2e-pandas

    name: Framework / ${{ matrix.directory }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11

      - name: Cleanup caches by directories
        # Only keep caches that match the latest keys for each directory
        run: |
          gh extension install actions/gh-actions-cache

          REPO=${{ github.repository }}
          # The producer job is named `frameworks`; keep this namespace aligned
          # with github.job in framework-e2e.yml.
          CACHE_JOB_NAME=frameworks
          CACHE_PREFIX="pythonloc-${{ runner.os }}-${CACHE_JOB_NAME}-${{ matrix.directory }}-"
          LATEST_KEY="${CACHE_PREFIX}${{ env.pythonLocation }}-${{ hashFiles(format('./framework/e2e/{0}/pyproject.toml', matrix.directory), 'framework/pyproject.toml', 'framework/uv.lock') }}"

          echo "Fetching list of cache keys"
          cacheKeys=$(gh actions-cache list -R "$REPO" | awk '{print $1}' | grep -F "$CACHE_PREFIX" || true)

          ## Setting this to not fail the workflow while deleting cache keys. 
          set +e
          echo "Deleting caches..."
          for cacheKey in $cacheKeys
          do
            if [ "$cacheKey" != "$LATEST_KEY" ]; then
              echo -e "\tOld key found -> $cacheKey"
              gh actions-cache delete "$cacheKey" --confirm
            fi
          done

          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
