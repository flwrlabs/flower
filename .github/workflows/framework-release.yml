name: Framework Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      flower-repo-ref:
        description: "Flower repository branch, tag, or commit to sync before building."
        required: false
        default: main
      package-version:
        description: "Framework package version. Leave empty to derive from the release tag or pyproject.toml."
        required: false
        default: ""
      pypi-repository-url:
        description: "Python package repository URL. Leave empty for the repository default."
        required: false
        default: ""
      pypi-repository-name:
        description: "Poetry repository alias for the Python package repository."
        required: false
        default: "private"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-wheel:
    name: Publish wheel
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      flwr-version: ${{ steps.publish.outputs.flwr-version }}
    env:
      FLWR_TELEMETRY_ENABLED: 0
      PYPI_REPOSITORY_PASSWORD: ${{ secrets.PYPI_REPOSITORY_PASSWORD || secrets.PYPI_TOKEN_RELEASE_FLWR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bootstrap
        uses: ./.github/actions/bootstrap

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patch rsync

      - id: publish
        env:
          FLOWER_REPO_REF: ${{ inputs.flower-repo-ref || 'main' }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          PYPI_REPOSITORY_URL: ${{ inputs.pypi-repository-url || vars.PYPI_REPOSITORY_URL }}
          PYPI_REPOSITORY_NAME: ${{ inputs.pypi-repository-name || 'private' }}
          PYPI_REPOSITORY_USERNAME: ${{ vars.PYPI_REPOSITORY_USERNAME || '__token__' }}
        run: ./framework/dev/release/publish-wheel.sh
