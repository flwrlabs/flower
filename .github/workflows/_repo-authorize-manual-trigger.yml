name: Authorize manual trigger

on:
  workflow_call:
    inputs:
      caller-event-name:
        description: "Event name that triggered the caller workflow"
        required: true
        type: string
      allowed-permissions:
        description: "Comma-separated repository role names or base permissions allowed to run the workflow manually"
        required: false
        type: string
        default: "maintain,admin"

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize manual trigger
    runs-on: ubuntu-22.04
    steps:
      - name: Skip non-manual trigger
        if: ${{ inputs['caller-event-name'] != 'workflow_dispatch' }}
        run: echo "Manual trigger authorization is not required for ${{ inputs['caller-event-name'] }}."

      - name: Check triggering user permissions
        if: ${{ inputs['caller-event-name'] == 'workflow_dispatch' }}
        uses: actions/github-script@v8
        with:
          script: |
            const allowedPermissionsInput = ${{ toJSON(inputs['allowed-permissions']) }};
            const allowedPermissions = new Set(
              allowedPermissionsInput
                .split(",")
                .map((permission) => permission.trim())
                .filter(Boolean)
            );
            const username = context.payload.sender?.login ?? context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username,
            });

            let isAllowed = allowedPermissions.has(data.role_name);

            if (!isAllowed && allowedPermissions.has("admin") && data.permission === "admin") {
              isAllowed = true;
            }

            if (!isAllowed && allowedPermissions.has("maintain") && data.permission === "write") {
              const collaborators = await github.paginate(github.rest.repos.listCollaborators, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                affiliation: "all",
                per_page: 100,
              });
              const collaborator = collaborators.find(
                (candidate) => candidate.login.toLowerCase() === username.toLowerCase()
              );
              const permissions = collaborator?.permissions ?? {};
              isAllowed = Boolean(permissions.maintain || permissions.admin);
            }

            core.info(
              `Manual run requested by ${username} with ${data.role_name} role (${data.permission} permission)`
            );

            if (!isAllowed) {
              core.setFailed(
                `workflow_dispatch is limited to maintainers; ${username} has ${data.role_name} role`
              );
            }
