name: "authorize-manual-trigger"
description: "Fail workflow_dispatch runs unless the triggering user has maintainer-level repository permissions"
inputs:
  allowed-permissions:
    description: "Comma-separated repository permissions allowed to run the workflow manually"
    required: false
    default: "write,maintain,admin"
runs:
  using: "composite"
  steps:
    - name: Check triggering user permissions
      uses: actions/github-script@v8
      with:
        script: |
          const allowedPermissions = new Set(
            core
              .getInput("allowed-permissions")
              .split(",")
              .map((permission) => permission.trim())
              .filter(Boolean)
          );
          const username = context.payload.sender?.login ?? context.actor;
          const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
            owner: context.repo.owner,
            repo: context.repo.repo,
            username,
          });

          core.info(`Manual run requested by ${username} with ${data.permission} permission`);

          if (!allowedPermissions.has(data.permission)) {
            core.setFailed(
              `workflow_dispatch is limited to maintainers; ${username} has ${data.permission} permission`
            );
          }
