# Paper-scale CIFAR-100 parity profile (ResNet-18, density 0.5, seed 550).
#
# Matches the legacy README recipe:
#   client_num_in_total=100, frac=0.1, epochs=10, batch_size=128,
#   lr=0.1, scheduler=cosine_annealing, momentum=0.9,
#   partition_alpha=0.3, dense_ratio=0.5, seed=550
#
# Legacy used comm_round=1000 but executed 999 training rounds
# (range(1, comm_round)). Flower uses 999 here for that parity.
#
# Outputs (under checkpoint-dir):
#   summary.json       - final accuracy/loss, mask digest, config, comm totals
#   metrics.jsonl      - per-eval / per-train event log
#   init_*.pt / round_*_*.pt / final_*.pt - model + mask checkpoints
#   wandb/             - if wandb-mode=offline|online

num-server-rounds = 999
num-clients = 100
fraction-train = 0.1
fraction-evaluate = 0.0
local-epochs = 10
batch-size = 128
max-partition-samples = 0
learning-rate = 0.1
lr-scheduler = "cosine-annealing"
lr-decay = 0.998
scheduler-cycle-length = 10
momentum = 0.9
weight-decay = 0.0005
max-grad-norm = 10.0
dataset = "cifar100"
model = "resnet18"
partition-alpha = 0.3
partition-method = "balanced-dirichlet"
dense-ratio = 0.5
saliency-method = "ssfl"
saliency-batches = 1
saliency-weighting = "uniform"
seed = 550
transport = "sparse"
evaluate-every = 10
save-model = true
save-checkpoints = true
save-metrics = true
checkpoint-dir = "outputs/cifar100_paper"
# Offline logging requires no W&B account. Override with wandb-mode="online"
# and wandb-entity="<your-entity>" to sync to your own account.
wandb-mode = "offline"
wandb-project = "ssfl-flower"
wandb-run-name = "C100_SSFL_dns0.5_seed550"
