# ---------------------------------------------------------------------------
# Flower Decentralized Node — configuration example (dynamic topology)
# ---------------------------------------------------------------------------
# This file configures a single DNode for dynamic (gossip-based) topology.
#
# Usage:
#   python -m quickstart_decentralized.run_dynamic
# Or passing this file via CLI:
#   flwr-super-dnode run --config configs/node_dynamic.yaml
# ---------------------------------------------------------------------------

# Runtime context: only nodes sharing the same context can communicate.
context: quickstart

address: 0.0.0.0
port: 9100

tcp: true
udp: false

# Bootstrap peers (optional).  Set to the address of at least one known node
# so that discovery can start.
# bootnodes:
#   - "192.168.1.10:9100"

topology:
  mode: dynamic

# Peer sampling configuration (required for dynamic mode).
# Algorithm choices: gbps | brahams | basalt
sampling:
  algorithm: gbps
  config_file: /tmp/flwr_decentralized_sampling.json
  params:
    view_size: 5
    heal: 0
    swap: 0
    selection_policy: old        # rand | old
    propagation_policy: pushpull  # push | pushpull
    delay: 1
    age: 1

# Network tuning (all fields are optional — defaults shown below).
network:
  idle_connection_timeout_secs: 60
  enable_mdns: true
  enable_kad: true
  yamux:
    max_buffer_size: 1048576
    receive_window: 262144
    max_num_streams: 8192
  request_response:
    request_timeout_secs: 30
    max_concurrent_streams: 100
  kademlia:
    query_timeout_secs: 60
    kbucket_size: 20
  mdns:
    query_interval_secs: 300
    ttl_secs: 360
    enable_ipv6: false
