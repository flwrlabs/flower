[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbs-pytorch"
version = "1.0.0"
description = "ResNet-18 on CIFAR-10 with Flower on four PBS nodes"
license = "Apache-2.0"
dependencies = [
  "flwr[simulation]>=1.39.0",
  "torch==2.10.0",
  "torchvision==0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pbs_pytorch"]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "pbs_pytorch.server_app:app"
clientapp = "pbs_pytorch.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
num-partitions = 3
local-epochs = 1
batch-size = 64
learning-rate = 0.01
