[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowertune-llm"
version = "1.0.0"
description = "FlowerTune LLM: Federated LLM Fine-tuning with Flower"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.25.0",
    "flwr-datasets>=0.5.0",
    "torch==2.9.1",
    "trl==0.8.1",
    "bitsandbytes==0.49.0",
    "scipy==1.13.0",
    "peft==0.20.0",
    "galore-torch==1.0",
    "fschat[model_worker,webui]==0.2.35",
    "transformers==4.53.0",
    "sentencepiece==0.2.0",
    "omegaconf==2.3.0",
    "hf_transfer==0.1.8",
    "psutil==6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["flowertune_llm/templates/*.j2"]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "flowertune_llm.server_app:app"
clientapp = "flowertune_llm.client_app:app"

[tool.flwr.app.config]
dataset.name = "vicgalle/alpaca-gpt4"
model.name = "openlm-research/open_llama_3b_v2"
model.quantization = 4
model.gradient-checkpointing = true
model.dtype = "bfloat16"
model.device-map = ""
model.load-in-4bit = false
model.bnb-quant-type = "nf4"
model.bnb-double-quant = true
model.seed = 2026
model.lora.enabled = false
model.lora.rank = 8
model.lora.alpha = 16
model.lora.dropout = 0.0
model.lora.use-rslora = false
model.lora.use-dora = false
model.lora.freeze-a = false
model.lora.target-modules = "q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj"
profile.enabled = false
profile.output = ""
validation.enabled = false
validation.sequence-length = 32
validation.output = ""
aggregation.mode = "layerwise"
aggregation.updates = "weights"
aggregation.upload-target-message-size = 2048
aggregation.download-target-message-size = 2048
aggregation.download-pipeline-depth = 1
aggregation.layer-write-dir = ""
aggregation.offload = false
aggregation.offload-dir = ""
compression.enabled = false
compression.download-enabled = false
compression.pipeline = "turboquant_mse"
compression.n-bits = 3
compression.block-size = 262144
compression.cuda-enabled = false
compression.rotation-enabled = true
compression.rotation-seed = 2025
train.save-every-round = 5
train.learning-rate-max = 5e-5
train.learning-rate-min = 1e-6
train.seq-length = 512
train.training-arguments.output-dir = ""
train.training-arguments.learning-rate = ""
train.training-arguments.per-device-train-batch-size = 1
train.training-arguments.gradient-accumulation-steps = 1
train.training-arguments.logging-steps = 10
train.training-arguments.num-train-epochs = 3
train.training-arguments.max-steps = 10
train.training-arguments.save-steps = 1000
train.training-arguments.save-total-limit = 10
train.training-arguments.gradient-checkpointing = true
train.training-arguments.lr-scheduler-type = "constant"
train.disable = false
trainer.backend = "none"
train.minimal-seq-length = 8
train.minimal-learning-rate = 1e-2
train.minimal-steps = 1
train.substantial-steps = 25
train.substantial-seq-length = 128
train.substantial-learning-rate = 1e-3
train.substantial-last-layers = 2
train.substantial-gpu-lock = "/tmp/flwr-gpu.lock"
train.benchmark.dataset-name = "vicgalle/alpaca-gpt4"
train.benchmark.steps = 25
train.benchmark.seq-length = 128
train.benchmark.learning-rate = 5e-4
train.benchmark.weight-decay = 0.0
train.benchmark.last-layers = 2
train.benchmark.optimizer = "adamw"
train.benchmark.gradient-checkpointing = true
train.benchmark.measure-delta-norm = false
train.benchmark.num-partitions = 2
train.benchmark.data-seed = 0
train.benchmark.validation-enabled = false
train.benchmark.quantized-validation-enabled = false
train.benchmark.quantized-validation-initial = false
train.benchmark.validation-examples = 32
train.benchmark.validation-batch-size = 8
train.benchmark.validation-output = ""
train.pretraining.corpus-url = "https://huggingface.co/datasets/bigcode/the-stack-smol-xs/resolve/main/data/python/data.json"
train.pretraining.validation-corpus-url = "https://huggingface.co/datasets/codeparrot/codeparrot-clean-valid/resolve/main/file-000000000054.json.gz"
train.pretraining.max-documents = 0
train.pretraining.steps = 50
train.pretraining.seq-length = 128
train.pretraining.learning-rate = 2e-5
train.pretraining.optimizer = "adamw8bit"
train.pretraining.gradient-checkpointing = true
train.pretraining.num-partitions = 2
train.pretraining.validation-enabled = false
train.pretraining.validation-documents = 20
train.pretraining.validation-windows = 16
train.pretraining.validation-batch-size = 8
train.pretraining.validation-output = ""
train.pretraining.quantized-validation-enabled = false
train.pretraining.quantized-validation-initial = false
train.pretraining.galore-rank = 256
train.pretraining.galore-update-gap = 50
train.pretraining.galore-scale = 1.0
train.pretraining.relora-merge-frequency = 2
train.pretraining.data-seed = 0
train.pretraining.final-state-output = ""
trainer.dry-run = false
trainer.python-exec = "python"
trainer.env-setup = ""
trainer.dump-folder = ""
trainer.num-nodes = 1
trainer.torchtitan.command = ""
trainer.torchtitan.workdir = ""
trainer.torchtitan.entrypoint = ""
trainer.torchtitan.config-template = ""
trainer.torchtitan.config-filename = "torchtitan_generated.toml"
trainer.torchtitan.model-flavor = ""
trainer.torchtitan.dcp-enabled = false
trainer.torchtitan.dcp-convert-on-client = false
trainer.torchtitan.dcp-separate-jobs = false
trainer.torchtitan.dcp-train-spec = "llama3"
trainer.torchtitan.dcp-model-args = "auto"
trainer.torchtitan.dcp-threads = 8
scheduler.backend = "local"
scheduler.account = ""
scheduler.partition = ""
scheduler.qos = ""
scheduler.gpus = ""
scheduler.cpus-per-task = ""
scheduler.mem = ""
scheduler.time = ""
scheduler.extra-args = ""
scheduler.slurm.submit-command = "sbatch"
scheduler.slurm.extra-args = ""
scheduler.slurm.wait = true
scheduler.slurm.script-template = ""
scheduler.slurm.to-dcp-script-template = ""
scheduler.slurm.from-dcp-script-template = ""
scheduler.flux.run-command = "flux run"
scheduler.flux.submit-command = "flux submit"
scheduler.flux.attach-command = "flux job attach --read-only"
scheduler.flux.extra-args = ""
scheduler.flux.script-template = ""
scheduler.flux.to-dcp-script-template = ""
scheduler.flux.from-dcp-script-template = ""
scheduler.conversion.extra-args = ""
scheduler.conversion.account = ""
scheduler.conversion.partition = ""
scheduler.conversion.qos = ""
scheduler.conversion.gpus = ""
scheduler.conversion.cpus-per-task = ""
scheduler.conversion.mem = ""
scheduler.conversion.time = ""
scheduler.slurm.conversion-extra-args = ""
scheduler.flux.conversion-extra-args = ""
client.name = ""
client.machine = ""
client.workspace = ""
client.dataset-name = ""
client.dataset-path = ""
client.hf-assets-path = ""
client.train-steps = 0
strategy.fraction-train = 0.1
strategy.fraction-evaluate = 0.0
strategy.timeout = 3600
num-server-rounds = 10
grid.pull-interval = 0.1

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 4
options.backend.client-resources.num-cpus = 8
options.backend.client-resources.num-gpus = 1.0

[tool.flwr.federations.remote-deployment]
address = "0.0.0.0:9093"
insecure = true

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true



#######################################################################
# Compatibility note:
# Keep [tool.flwr.federations] here for CLI versions that still read
# SuperLink connection config from pyproject.toml.
#######################################################################
