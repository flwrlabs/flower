[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickstart-cpp"
version = "1.0.0"
description = "Flower C++ quickstart example with synthetic linear regression"
license = "Apache-2.0"
dependencies = ["flwr==1.36.0", "numpy>=1.24.0"]
# Flower requires Python >=3.11, so this project cannot claim 3.10 support.
# Modern pip/uv resolve across every version in `requires-python`, so `>=3.10`
# makes `uv sync` fail with "No solution found when resolving dependencies for
# split (markers: python_full_version == '3.10.*')".
requires-python = ">=3.11"

[tool.flwr.app]
publisher = "flower"

[tool.flwr.app.components]
serverapp = "server:app"
clientapp = "client:app"


# Flower 1.36.0 serves its gRPC Control API on 9093. On the first `flwr run`,
# Flower migrates this connection to the Flower config and comments this block
# out. Later runs use that config (normally ~/.flwr/config.toml).
#
# Docs: https://flower.ai/docs/framework/ref-flower-configuration.html
[tool.flwr.federations]
default = "local-deployment"

[tool.flwr.federations.local-deployment]
address = "127.0.0.1:9093"
insecure = true
